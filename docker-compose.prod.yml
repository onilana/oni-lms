services:
  backend:
    build:
      context: ./backend
    working_dir: /var/www/html
    restart: unless-stopped
    command: sh -c "php artisan config:cache && php artisan route:cache && php-fpm -F"
    volumes:
      - ./backend:/var/www/html
      - backend_backups:/var/www/html/storage/app/backups
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    working_dir: /var/www/html
    restart: unless-stopped
    command: sh -c "php artisan schedule:work"
    volumes:
      - ./backend:/var/www/html
      - backend_backups:/var/www/html/storage/app/backups
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./backend:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-oni_lms}
      POSTGRES_USER: ${DB_USERNAME:-oni_lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oni_lms} -d ${DB_DATABASE:-oni_lms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
  backend_backups:
